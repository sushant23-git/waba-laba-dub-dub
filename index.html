<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATLAB Practical Codes</title>

<style>
body{
font-family:Arial,sans-serif;
background:#121212;
color:white;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#00d9ff;
margin-bottom:30px;
}

.card{
background:#1e1e1e;
padding:20px;
margin-bottom:25px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,255,255,0.3);
}

h2{
color:#00ff95;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
background:#00d9ff;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}

button:hover{
background:#00b3d1;
}

pre{
background:#000;
padding:15px;
border-radius:10px;
overflow:auto;
white-space:pre-wrap;
color:#00ff00;
}
</style>

</head>
<body>

<h1>MATLAB Practical Codes</h1>

<div id="container"></div>

<script>

const practicals=[

{
title:"Prac 1: Transfer Function",
code:`clc; clear; close all; s=tf('s');

disp('--- Individual Transfer Functions ---'); 
G1 = 1/(s+1)
G2 = 2/(s+2)

disp('--- Overall Transfer Function (Series) ---'); 
series(G1,G2)

disp('--- Overall Transfer Function (Parallel) ---'); 
parallel(G1,G2)

disp('--- Overall Transfer Function (Feedback) ---'); 
feedback(G1,G2)`
},

{
title:"Prac 2: Step Response",
code:`clc; clear; close all; w=5; z=0.5;
sys=tf(w^2,[1 2*z*w w^2]);

disp('Transfer Function:');
sys

[y,t]=step(sys);

figure;
plot(t,y,'k','LineWidth',3);
grid on;

title('Unit Step Response');
xlabel('Time');
ylabel('Amplitude');

i=stepinfo(sys);

disp('--- Unit Step Response Parameters ---');

fprintf('Rise Time = %.4f sec\\n',i.RiseTime);
fprintf('Peak Time = %.4f sec\\n',i.PeakTime);
fprintf('Settling Time = %.4f sec\\n',i.SettlingTime);
fprintf('Overshoot = %.2f %%\\n',i.Overshoot);`
},

{
title:"Prac 3: Steady State Errors",
code:`clc; clear; close all;

syms s;
G_s=10/(s*(s+2));

disp('Symbolic TF:');
pretty(G_s);

s=tf('s');
G=10/(s*(s+2));

kp=dcgain(G);
kv=dcgain(s*G);
ka=dcgain(s^2*G);

fprintf('\\nSTEADY STATE ANALYSIS\\n\\n');

fprintf('Position error constant=%g\\n',kp);
fprintf('Velocity error constant=%g\\n',kv);
fprintf('Acceleration error constant=%g\\n\\n',ka);

fprintf('Unit Step error=%g\\n',1/(1+kp));
fprintf('Ramp error=%g\\n',1/kv);
fprintf('Parabolic error=%g\\n',1/ka);`
},

{
title:"Prac 4: Parameter Variation",
code:`clc; clear; close all;

w=5;
z=0.5;

figure;
hold on;

for K=[1 5 10]
step(tf(K*w^2,[1 2*z*w K*w^2]));
end

legend('1','5','10');

figure;
hold on;

for Z=[0.2 0.5 0.8]
step(tf(w^2,[1 2*Z*w w^2]));
end

legend('0.2','0.5','0.8');

figure;
hold on;

for W=[2 5 8]
step(tf(W^2,[1 2*z*W W^2]));
end

legend('2','5','8');`
},

{
title:"Prac 5: Root Locus",
code:`clc; clear; close all;

G=tf(1,[1 7 10 0]);

figure;
rlocus(G);
grid on;

title('Root Locus');

disp('Click plot');

[K,p]=rlocfind(G);

disp('Gain K');
disp(K);

disp('Poles');
disp(p);

T=feedback(K*G,1);

figure;
step(T);

grid on;

title('Step Response');

disp(stepinfo(T));`
},

{
title:"Prac 6: Lead Compensation",
code:`clc; clear; close all;

G=tf(10,[1 1 0]);

Gc=0.9*tf([1 1],[1 3]);

T1=feedback(G,1);

T2=feedback(series(Gc,G),1);

figure;

step(T1,'r',T2,'b');

grid on;

legend('Uncompensated','Lead Compensated');

title('Step Response Comparison');`
},

{
title:"Prac 7: Bode Plot",
code:`clc; clear; close all;

G=tf(100,[1 22 40 0]);

figure;

bode(G);

grid on;

title('Bode Plot');

[GM,PM,Wcg,Wcp]=margin(G);

disp('Gain Margin');
disp(GM);

disp('Phase Margin');
disp(PM);

disp('Gain Crossover');
disp(Wcg);

disp('Phase Crossover');
disp(Wcp);`
},

{
title:"Prac 8: State Space",
code:`clc; clear; close all;

n=[1 3];
d=[1 5 6];

G=tf(n,d);

[A,B,C,D]=tf2ss(n,d);

sys=ss(A,B,C,D);

[n2,d2]=ss2tf(A,B,C,D);

G2=tf(n2,d2);

disp('Original TF');
G

disp('State Space');
sys

disp('Converted TF');
G2

figure;

step(G,'r',G2,'b--');

grid on;

legend('Original','Converted');`
}

];

let html="";

practicals.forEach((p,index)=>{

html+=`
<div class="card">

<h2>${p.title}</h2>

<button onclick="copyCode(${index})">
Copy Code
</button>

<pre id="code${index}">
${p.code}
</pre>

</div>
`;
});

document.getElementById("container").innerHTML=html;

function copyCode(index){

let text=document.getElementById(
"code"+index
).innerText;

navigator.clipboard.writeText(text);

alert("Code copied!");
}

</script>

</body>
</html>
